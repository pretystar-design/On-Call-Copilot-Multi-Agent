kind: hosted
name: oncall-copilot
protocols:
    - protocol: responses
      version: 1.0.0
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    - name: AZURE_AI_PROJECT_ENDPOINT
      value: ${AZURE_AI_PROJECT_ENDPOINT}
    - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
      value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    - name: MODEL_ROUTER_DEPLOYMENT
      value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    - name: AZURE_TENANT_ID
      value: ${AZURE_TENANT_ID}
    - name: LOG_LEVEL
      value: INFO
    - name: MCP_SERVERS
      value: ${MCP_SERVERS}
    - name: SKILL_CATALOG__ELASTIC__DIR
      value: skills/elastic/
    - name: SKILL_CATALOG__MICROSOFT__DIR
      value: skills/microsoft/
    - name: ELASTIC_SKILLS_DIR
      value: skills/elastic/
    - name: MS_SKILLS_DIR
      value: skills/microsoft/
    - name: ELASTIC_CLOUD_ENDPOINT
      value: ${ELASTIC_CLOUD_ENDPOINT}
    - name: ELASTIC_API_KEY
      value: ${ELASTIC_API_KEY}
